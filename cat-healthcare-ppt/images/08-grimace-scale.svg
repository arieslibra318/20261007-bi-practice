<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f5ee" />
      <stop offset="100%" stop-color="#ece6d8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#paperBg)" rx="12" />
  
  <!-- Outer Framing -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#cfc7b4" stroke-width="1.2" rx="8" />
  <line x1="24" y1="84" x2="776" y2="84" stroke="#cfc7b4" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Meta Header -->
  <text x="50" y="58" fill="#506654" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="2.5">CLINICAL VETERINARY ASSESSMENT</text>
  <text x="750" y="58" text-anchor="end" fill="#506654" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.5">FELINE GRIMACE SCALE (FGS)</text>

  <!-- Title -->
  <text x="50" y="126" fill="#1a2e1f" font-family="'Playfair Display', serif" font-size="26" font-weight="700">Five Facial Action Units</text>
  <text x="50" y="152" fill="#5c665e" font-family="'Noto Sans SC', sans-serif" font-size="13">蒙特利爾大學貓科疼痛評估標準：總分 ≥4/10 即需醫療鎮痛干預</text>

  <!-- 5 Action Unit Cards Grid -->
  <!-- Item 1: Ears -->
  <g transform="translate(50, 180)">
    <rect width="130" height="255" fill="#ffffff" rx="6" stroke="#ded8c8" stroke-width="1" />
    <rect x="12" y="16" width="30" height="20" rx="3" fill="#e8eee9" />
    <text x="27" y="30" text-anchor="middle" fill="#1a2e1f" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">01</text>
    <text x="12" y="62" fill="#1a2e1f" font-family="'Noto Serif SC', serif" font-size="15" font-weight="700">耳朵姿態</text>
    <text x="12" y="80" fill="#7a857c" font-family="'IBM Plex Mono', monospace" font-size="10">EAR POSITION</text>
    <line x1="12" y1="95" x2="118" y2="95" stroke="#ece7da" stroke-width="1" />
    <text x="12" y="122" fill="#2d5236" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">正常 (0分)</text>
    <text x="12" y="140" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">雙耳自然直立朝前</text>
    <line x1="12" y1="165" x2="118" y2="165" stroke="#f0ebe0" stroke-width="1" stroke-dasharray="2,2" />
    <text x="12" y="192" fill="#a8432a" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">明顯疼痛 (2分)</text>
    <text x="12" y="210" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">雙耳向兩側水平</text>
    <text x="12" y="228" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">平貼或旋轉後倒</text>
  </g>

  <!-- Item 2: Eyes -->
  <g transform="translate(195, 180)">
    <rect width="130" height="255" fill="#ffffff" rx="6" stroke="#ded8c8" stroke-width="1" />
    <rect x="12" y="16" width="30" height="20" rx="3" fill="#e8eee9" />
    <text x="27" y="30" text-anchor="middle" fill="#1a2e1f" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">02</text>
    <text x="12" y="62" fill="#1a2e1f" font-family="'Noto Serif SC', serif" font-size="15" font-weight="700">眼睛開闔</text>
    <text x="12" y="80" fill="#7a857c" font-family="'IBM Plex Mono', monospace" font-size="10">ORBITAL SIGHT</text>
    <line x1="12" y1="95" x2="118" y2="95" stroke="#ece7da" stroke-width="1" />
    <text x="12" y="122" fill="#2d5236" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">正常 (0分)</text>
    <text x="12" y="140" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">眼眶圓潤完全張開</text>
    <line x1="12" y1="165" x2="118" y2="165" stroke="#f0ebe0" stroke-width="1" stroke-dasharray="2,2" />
    <text x="12" y="192" fill="#a8432a" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">明顯疼痛 (2分)</text>
    <text x="12" y="210" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">眼瞼緊閉或半瞇</text>
    <text x="12" y="228" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">呈細縫無眼神聚焦</text>
  </g>

  <!-- Item 3: Muzzle -->
  <g transform="translate(340, 180)">
    <rect width="130" height="255" fill="#ffffff" rx="6" stroke="#ded8c8" stroke-width="1" />
    <rect x="12" y="16" width="30" height="20" rx="3" fill="#e8eee9" />
    <text x="27" y="30" text-anchor="middle" fill="#1a2e1f" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">03</text>
    <text x="12" y="62" fill="#1a2e1f" font-family="'Noto Serif SC', serif" font-size="15" font-weight="700">口吻部張力</text>
    <text x="12" y="80" fill="#7a857c" font-family="'IBM Plex Mono', monospace" font-size="10">MUZZLE TENSION</text>
    <line x1="12" y1="95" x2="118" y2="95" stroke="#ece7da" stroke-width="1" />
    <text x="12" y="122" fill="#2d5236" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">正常 (0分)</text>
    <text x="12" y="140" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">吻部呈圓形自然弧度</text>
    <line x1="12" y1="165" x2="118" y2="165" stroke="#f0ebe0" stroke-width="1" stroke-dasharray="2,2" />
    <text x="12" y="192" fill="#a8432a" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">明顯疼痛 (2分)</text>
    <text x="12" y="210" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">肌肉緊繃收縮</text>
    <text x="12" y="228" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">呈橫向拉扯橢圓形</text>
  </g>

  <!-- Item 4: Whiskers -->
  <g transform="translate(485, 180)">
    <rect width="130" height="255" fill="#ffffff" rx="6" stroke="#ded8c8" stroke-width="1" />
    <rect x="12" y="16" width="30" height="20" rx="3" fill="#e8eee9" />
    <text x="27" y="30" text-anchor="middle" fill="#1a2e1f" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">04</text>
    <text x="12" y="62" fill="#1a2e1f" font-family="'Noto Serif SC', serif" font-size="15" font-weight="700">鬍鬚走向</text>
    <text x="12" y="80" fill="#7a857c" font-family="'IBM Plex Mono', monospace" font-size="10">WHISKER CHANGE</text>
    <line x1="12" y1="95" x2="118" y2="95" stroke="#ece7da" stroke-width="1" />
    <text x="12" y="122" fill="#2d5236" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">正常 (0分)</text>
    <text x="12" y="140" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">鬆弛下垂弧度柔和</text>
    <line x1="12" y1="165" x2="118" y2="165" stroke="#f0ebe0" stroke-width="1" stroke-dasharray="2,2" />
    <text x="12" y="192" fill="#a8432a" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">明顯疼痛 (2分)</text>
    <text x="12" y="210" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">呈束狀筆直前伸</text>
    <text x="12" y="228" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">或向面部緊密貼合</text>
  </g>

  <!-- Item 5: Head Position -->
  <g transform="translate(630, 180)">
    <rect width="120" height="255" fill="#ffffff" rx="6" stroke="#ded8c8" stroke-width="1" />
    <rect x="12" y="16" width="30" height="20" rx="3" fill="#e8eee9" />
    <text x="27" y="30" text-anchor="middle" fill="#1a2e1f" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">05</text>
    <text x="12" y="62" fill="#1a2e1f" font-family="'Noto Serif SC', serif" font-size="15" font-weight="700">頭頸姿態</text>
    <text x="12" y="80" fill="#7a857c" font-family="'IBM Plex Mono', monospace" font-size="10">HEAD POSITION</text>
    <line x1="12" y1="95" x2="108" y2="95" stroke="#ece7da" stroke-width="1" />
    <text x="12" y="122" fill="#2d5236" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">正常 (0分)</text>
    <text x="12" y="140" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">頭部高於肩胛線</text>
    <line x1="12" y1="165" x2="108" y2="165" stroke="#f0ebe0" stroke-width="1" stroke-dasharray="2,2" />
    <text x="12" y="192" fill="#a8432a" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="600">明顯疼痛 (2分)</text>
    <text x="12" y="210" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">低頭垂肩下巴貼胸</text>
    <text x="12" y="228" fill="#667068" font-family="'Noto Sans SC', sans-serif" font-size="10.5">呈母雞蹲防衛姿態</text>
  </g>
</svg>
