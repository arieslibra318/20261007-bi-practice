<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f3d" />
      <stop offset="100%" stop-color="#051224" />
    </linearGradient>
    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14345f" />
      <stop offset="100%" stop-color="#0f2647" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#mathBg)" rx="10" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#22426d" stroke-width="1.2" rx="6" />
  <line x1="20" y1="78" x2="780" y2="78" stroke="#22426d" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Meta Header -->
  <text x="44" y="52" fill="#7ba3d6" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">WOOLDRIDGE (2019) · THEOREM 2.1 &amp; COROLLARIES</text>
  <text x="756" y="52" text-anchor="end" fill="#d0dfef" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1">ALGEBRAIC EQUIVALENCE</text>

  <!-- Title -->
  <text x="44" y="118" fill="#f1f3f5" font-family="'Playfair Display', serif" font-size="24" font-weight="700">Mundlak Regression on Unbalanced Panels</text>
  <text x="44" y="142" fill="#9dbcdb" font-family="'Noto Sans SC', sans-serif" font-size="12.5">以個體觀測均值 \bar{x}_i = T_i^{-1} \sum_{t=1}^T s_{it} x_{it} 進行 POLS / RE 估計的代數等價性</text>

  <!-- Equivalence Triangle Box -->
  <g transform="translate(44, 168)">
    <!-- Method A: POLS with Mundlak mean -->
    <rect x="0" y="0" width="220" height="150" fill="url(#boxBlue)" rx="6" stroke="#355e96" stroke-width="1.2" />
    <text x="18" y="32" fill="#7ba3d6" font-family="'IBM Plex Mono', monospace" font-size="11">ESTIMATOR 01</text>
    <text x="18" y="60" fill="#f1f3f5" font-family="'Playfair Display', serif" font-size="16" font-weight="700">Pooled OLS</text>
    <text x="18" y="86" fill="#ccddec" font-family="'IBM Plex Mono', monospace" font-size="11">y_it on (x_it, \bar{x}_i, z_i)</text>
    <rect x="18" y="105" width="184" height="28" rx="4" fill="#0c1d35" />
    <text x="110" y="124" text-anchor="middle" fill="#d4af37" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">\hat{\beta}_{POLS}</text>

    <!-- Equals Symbol 1 -->
    <text x="238" y="82" fill="#f3e5ab" font-family="'Playfair Display', serif" font-size="28" font-weight="700">≡</text>

    <!-- Method B: Random Effects GLS -->
    <rect x="254" y="0" width="220" height="150" fill="url(#boxBlue)" rx="6" stroke="#355e96" stroke-width="1.2" />
    <text x="18" y="32" fill="#7ba3d6" font-family="'IBM Plex Mono', monospace" font-size="11">ESTIMATOR 02</text>
    <text x="18" y="60" fill="#f1f3f5" font-family="'Playfair Display', serif" font-size="16" font-weight="700">Random Effects (GLS)</text>
    <text x="18" y="86" fill="#ccddec" font-family="'IBM Plex Mono', monospace" font-size="11">y_it on (x_it, \bar{x}_i, z_i)</text>
    <rect x="18" y="105" width="184" height="28" rx="4" fill="#0c1d35" />
    <text x="110" y="124" text-anchor="middle" fill="#d4af37" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">\hat{\beta}_{RE(GLS)}</text>

    <!-- Equals Symbol 2 -->
    <text x="492" y="82" fill="#f3e5ab" font-family="'Playfair Display', serif" font-size="28" font-weight="700">≡</text>

    <!-- Method C: Within FE -->
    <rect x="508" y="0" width="204" height="150" fill="url(#boxBlue)" rx="6" stroke="#d4af37" stroke-width="1.4" />
    <text x="18" y="32" fill="#f3e5ab" font-family="'IBM Plex Mono', monospace" font-size="11">BENCHMARK</text>
    <text x="18" y="60" fill="#f1f3f5" font-family="'Playfair Display', serif" font-size="16" font-weight="700">Fixed Effects (Within)</text>
    <text x="18" y="86" fill="#ccddec" font-family="'IBM Plex Mono', monospace" font-size="11">s_it(y_it - \bar{y}_i)</text>
    <rect x="18" y="105" width="168" height="28" rx="4" fill="#0c1d35" />
    <text x="102" y="124" text-anchor="middle" fill="#f3e5ab" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">\hat{\beta}_{FE(Within)}</text>
  </g>

  <!-- Bottom Insight: Fully Robust Hausman Test -->
  <g transform="translate(44, 342)">
    <rect width="712" height="110" fill="#0b1b31" rx="6" stroke="#254d7d" stroke-width="1" />
    <circle cx="28" cy="30" r="4" fill="#d4af37" />
    <text x="44" y="34" fill="#f3e5ab" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600">CRUCIAL BYPRODUCT: FULLY ROBUST HAUSMAN SPECIFICATION TEST</text>
    <text x="44" y="60" fill="#c4d8ed" font-family="'Noto Sans SC', sans-serif" font-size="12">
      傳統 Hausman 檢定在非平衡面板下經常因方差非正定而失效。CRE 框架直接檢定 H_0: \xi = 0。
    </text>
    <text x="44" y="86" fill="#7ba3d6" font-family="'IBM Plex Mono', monospace" font-size="11.5">
      Wald Test Statistic: W = \hat{\xi}' [Avar(\hat{\xi})]^{-1} \hat{\xi} ~ \chi^2_K (完全容許異方差與任意序列相關)
    </text>
  </g>
</svg>
